# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Strong JWT secret (should be at least 256 bits)
app.jwt.secret=myVerySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecurity
# Short token validity (15 minutes)
app.jwt.ttl-seconds=900
# JWT issuer and audience for validation
app.jwt.issuer=owasp-api-lab
app.jwt.audience=api-users

# Reduce error details in production (Security: API7-Security Misconfiguration)
server.error.include-message=on_param
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=INFO
